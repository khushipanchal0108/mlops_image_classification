name: ci-cd-image-classification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ---------------- CI: Testing & DVC Pipeline ----------------
  ci-pipeline:
    name: CI - Test & DVC
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "dvc[s3]" mlflow dvclive pytest

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Configure DVC remote
        run: |
          dvc remote add -f aws ${{ secrets.DVC_S3_URL }}
          dvc remote default aws

      - name: Run unit tests
        run: pytest -q --disable-warnings --maxfail=1

      - name: Pull DVC data
        run: |
          dvc pull --force || echo "Some DVC cache missing. Proceeding..."

      - name: Run DVC pipeline
        run: |
          dvc repro

      - name: Push DVC artifacts
        run: |
          dvc push || echo "No new artifacts to push"

      - name: Upload metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metrics
          path: reports/metrics.json

  # ---------------- CD: Docker Build & Deploy ----------------
  cd-deploy:
    name: CD - Docker Deploy to AWS EC2
    needs: ci-pipeline
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------- Build Docker image ----------------
      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/mlops_classification_cicd:latest .

      # ---------------- Login to Docker Hub ----------------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ---------------- Push Docker image ----------------
      - name: Push Docker image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/mlops_classification_cicd:latest

      # ---------------- Deploy on AWS EC2 ----------------
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Pull latest Docker image and restart container
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/mlops_classification_cicd:latest
            docker stop mlops_app || true
            docker rm mlops_app || true
            docker run -d -p 8080:8080 --name mlops_app ${{ secrets.DOCKERHUB_USERNAME }}/mlops_classification_cicd:latest
